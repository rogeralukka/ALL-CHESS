name: CI

on:
  push:
    branches: [main, backend-v1, backend-phase2, phase3, "ui/**"]
  pull_request:
    branches: [main, phase3]

jobs:
  backend-test:
    name: Backend Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      TESTING: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies (Stockfish)
        run: |
          sudo apt-get update
          sudo apt-get install -y stockfish

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Check undefined names
        run: |
          python -m pyflakes backend/app

      - name: Run pytest
        run: |
          pytest backend/tests -v

  frontend-check:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npx tsc --noEmit

      - name: Run vitest tests
        run: npm test

      - name: Build frontend
        run: npm run build
