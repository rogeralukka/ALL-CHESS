name: CI

on:
  push:
    branches: [main, backend-v1, backend-phase2]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Pytest
    runs-on: ubuntu-latest
    env:
      TESTING: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies (Stockfish)
        run: |
          sudo apt-get update
          sudo apt-get install -y stockfish

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run pytest
        run: |
          pytest backend/tests -v

  frontend-check:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npx tsc --noEmit

      - name: Run vitest tests
        run: npm test

      - name: Build frontend
        run: npm run build
