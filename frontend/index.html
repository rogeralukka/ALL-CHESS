<!DOCTYPE html>
<html lang="en" data-theme="dusk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ALL-CHESS — Free &amp; Private Chess Review &amp; Coach</title>
    <meta name="description" content="Free, private chess review and coaching with authentic coach expressions, evaluation graph, move classification, puzzles, and roadmap." />
    <link rel="icon" type="image/svg+xml" href="/pieces/cburnett/wN.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#141312" />
  </head>
  <body class="bg-theme-page text-theme-text antialiased selection:bg-theme-accent selection:text-black min-h-screen">
    <div id="root">
      <!-- boot splash: React replaces this as soon as it mounts -->
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#2a2825;font-family:Nunito,system-ui,sans-serif">
        <style>@keyframes bootHop{0%,100%{transform:translateY(0) scaleY(1)}12%{transform:translateY(0) scaleY(.86)}45%{transform:translateY(-34px) rotate(-8deg)}70%{transform:translateY(0) scaleY(1.04)}}@media (prefers-reduced-motion: reduce){.boot-hop{animation:none!important}}</style>
        <img class="boot-hop" src="/assets/ui/logo_king.webp" alt="" width="54" height="72" style="animation:bootHop 1s cubic-bezier(.3,.7,.4,1) infinite;filter:drop-shadow(0 6px 6px rgba(0,0,0,.45))" />
        <div style="color:#f3ede4;font-weight:900;font-size:20px;letter-spacing:-.01em">ALL-CHESS</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
